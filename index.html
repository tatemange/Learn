<!DOCTYPE html>
<html lang="fr" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoAI V3 | Tuteur Universel</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'media', 
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95',
                        }
                    },
                    borderRadius: { 'premium': '2.5rem' },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: 0, transform: 'translateY(15px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-slate-800 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden p-3 md:p-6 lg:p-8 flex flex-col items-center">

    <!-- Background Blobs -->
    <div class="fixed top-20 left-20 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob pointer-events-none dark:bg-purple-900 dark:mix-blend-screen"></div>
    <div class="fixed top-20 right-20 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-2000 pointer-events-none dark:bg-yellow-900 dark:mix-blend-screen"></div>

    <main class="w-full max-w-6xl relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Header & Stats (Left / Top) -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            <!-- Branding -->
            <header class="glass-panel p-6 rounded-3xl text-center lg:text-left animate-fade-in-up flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-center lg:justify-start gap-3 mb-2">
                        <div class="bg-gradient-to-br from-violet-400 to-blue-500 text-white p-2 rounded-xl">
                            <i data-lucide="brain-circuit" class="w-6 h-6"></i>
                        </div>
                        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-500 to-blue-600 dark:from-violet-400 dark:to-blue-400">
                            LingoAI <span class="text-sm font-light text-slate-400">V3</span>
                        </h1>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">
                        Votre tuteur universel (Maths, Physique, Langues).
                    </p>
                </div>
            </header>

            <!-- Stats Chart -->
            <section class="glass-panel p-6 rounded-3xl animate-fade-in-up" style="animation-delay: 0.1s;">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4"></i>
                    Compétences
                </h3>
                <div class="aspect-square w-full relative max-h-[300px]">
                    <canvas id="skillsChart"></canvas>
                </div>
            </section>
        </div>

        <!-- Main Workspace (Right / Center) -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            
            <!-- Context & Interaction -->
            <section class="glass-panel rounded-premium p-6 md:p-8 animate-fade-in-up relative overflow-hidden flex flex-col gap-6" style="animation-delay: 0.2s;">
                
                <!-- Subject Selector Tabs -->
                <div class="flex flex-wrap gap-2 justify-center lg:justify-start bg-slate-100/50 dark:bg-slate-800/50 p-2 rounded-2xl w-fit mx-auto lg:mx-0 max-h-[140px] overflow-y-auto custom-scrollbar">
                    <button onclick="setSubject('english')" class="subject-tab tab-active px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                        <i data-lucide="languages" class="w-4 h-4"></i> Anglais
                    </button>
                    <button onclick="setSubject('math')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="sigma" class="w-4 h-4"></i> Maths
                    </button>
                    <button onclick="setSubject('physics')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="atom" class="w-4 h-4"></i> Physique
                    </button>
                    <button onclick="setSubject('code')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="code-2" class="w-4 h-4"></i> Code
                    </button>
                    <button onclick="setSubject('history')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="scroll" class="w-4 h-4"></i> Histoire
                    </button>
                    <button onclick="setSubject('biology')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="dna" class="w-4 h-4"></i> Biologie
                    </button>
                    <button onclick="setSubject('chemistry')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="flask-conical" class="w-4 h-4"></i> Chimie
                    </button>
                    <button onclick="setSubject('economy')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="trending-up" class="w-4 h-4"></i> Économie
                    </button>
                    <button onclick="setSubject('philosophy')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="brain-circuit" class="w-4 h-4"></i> Philo
                    </button>
                    <button onclick="setSubject('geography')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="map" class="w-4 h-4"></i> Géo
                    </button>
                    <button onclick="setSubject('literature')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="book-open" class="w-4 h-4"></i> Littérature
                    </button>
                    <button onclick="setSubject('general')" class="subject-tab px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 hover:bg-white/50 dark:hover:bg-slate-700/50">
                        <i data-lucide="globe" class="w-4 h-4"></i> Culture G
                    </button>
                </div>

                <!-- Generator -->
                <div id="generatorContainer" class="flex flex-col items-center gap-4">
                    <button id="btnGenerate" onclick="generateContent()" class="relative w-fit bg-gradient-to-r from-violet-500 to-violet-600 hover:from-violet-600 hover:to-violet-700 text-white font-bold py-3 px-6 rounded-2xl transform transition-all hover:-translate-y-1 active:translate-y-0 disabled:opacity-70 disabled:cursor-not-allowed">
                        <div class="flex items-center justify-center gap-3">
                            <span id="btnIcon"><i data-lucide="sparkles" class="w-5 h-5 fill-current"></i></span>
                            <span id="btnText">Générer un exercice</span>
                        </div>
                        <div id="loadingIndicator" class="hidden absolute inset-0 flex items-center justify-center bg-violet-600 rounded-2xl">
                            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
                        </div>
                    </button>
                </div>

                <!-- Content Render Area -->
                <div id="contentContainer" class="hidden flex flex-col gap-6">
                    <div class="bg-white/50 dark:bg-slate-800/50 rounded-2xl p-6 text-center border border-white/40 dark:border-white/10 relative group min-h-[150px] flex flex-col justify-center items-center">
                        <div id="mainContent" class="text-2xl md:text-3xl font-bold text-slate-800 dark:text-slate-100 mb-2 leading-relaxed max-w-full overflow-x-auto">
                            <!-- Content -->
                        </div>
                        <div id="subContent" class="text-lg md:text-xl text-slate-500 dark:text-slate-400 italic mt-4 max-w-full overflow-x-auto">
                            <!-- Explanation/Translation -->
                        </div>
                    </div>

                    <!-- Dynamic Buttons -->
                    <div id="actionButtons" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <!-- Injected via JS based on Subject -->
                    </div>

                    <!-- Analysis Result -->
                    <div id="analysisResult" class="hidden animate-fade-in-up">
                        <div class="glass-panel rounded-2xl p-6 bg-white/80 dark:bg-slate-900/80 border-l-4 border-violet-500">
                             <div class="flex justify-between items-center mb-3">
                                <h4 class="font-bold text-lg flex items-center gap-2">
                                    <i data-lucide="microscope" class="w-4 h-4 text-violet-500"></i>
                                    Analyse Détaillée
                                </h4>
                                <button onclick="closeAnalysis()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                            <div id="analysisContent" class="prose prose-sm prose-slate dark:prose-invert max-w-none text-sm leading-relaxed overflow-x-auto"></div>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="welcomeState" class="text-center py-10 text-slate-400">
                    <i data-lucide="arrow-up" class="w-6 h-6 mx-auto mb-2 animate-bounce text-violet-500"></i>
                    <p>Sélectionnez un sujet et générez du contenu.</p>
                </div>
            </section>

            <!-- Chat Section (Floating Window) -->
            <section id="chatWindow" class="glass-panel rounded-premium p-0 flex flex-col w-[400px] h-[500px] fixed bottom-10 right-10 z-50 animate-fade-in-up shadow-2xl overflow-hidden" style="animation-delay: 0.3s;">
                <div id="chatHeader" class="p-4 border-b border-slate-200/50 dark:border-slate-700/50 cursor-grab active:cursor-grabbing bg-white/40 dark:bg-slate-800/40 backdrop-blur-md flex justify-between items-center select-none">
                    <div class="flex items-center gap-2">
                        <i data-lucide="messages-square" class="w-5 h-5 text-violet-500"></i>
                         <h3 class="font-bold text-sm">Discussion & Aide</h3>
                    </div>
                     <div class="flex gap-1.5 items-center">
                        <button onclick="toggleChat()" class="p-1 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 rounded-full transition-colors text-slate-500">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                
                <div class="p-4 flex flex-col flex-1 overflow-hidden">
                
                <div id="chatHistory" class="flex-1 overflow-y-auto chat-scroll space-y-4 mb-4 p-2">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-violet-100 dark:bg-violet-900 flex items-center justify-center flex-shrink-0">
                            <i data-lucide="bot" class="w-4 h-4 text-violet-600 dark:text-violet-300"></i>
                        </div>
                        <div class="bg-white/60 dark:bg-slate-700/60 p-3 rounded-2xl rounded-tl-none text-sm max-w-[85%]">
                            <p>Bonjour ! Je suis prêt pour les Maths, la Physique ou l'Anglais.</p>
                        </div>
                    </div>
                </div>

                <div class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full flex items-end p-1.5 gap-2 transition-all focus-within:ring-2 focus-within:ring-violet-500/50 shadow-sm hover:shadow-md">
                    <button class="p-2.5 mb-1 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex-shrink-0">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                    
                    <textarea id="chatInput" rows="1" placeholder="Poser une question" 
                        class="flex-1 bg-transparent border-none outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 py-3 resize-none max-h-32 overflow-y-auto"
                        onkeypress="handleChatEnter(event)" 
                        oninput="handleInputResize(this)"></textarea>
                        
                    <div class="flex items-center gap-1 mb-1 flex-shrink-0">
                         <button class="p-2.5 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                            <i data-lucide="mic" class="w-5 h-5"></i>
                        </button>
                        <button onclick="sendChatMessage()" class="w-10 h-10 bg-black text-white dark:bg-white dark:text-black rounded-full hover:opacity-80 transition-opacity flex items-center justify-center">
                            <i id="iconVoice" data-lucide="audio-lines" class="w-5 h-5"></i>
                            <i id="iconSend" data-lucide="arrow-up" class="w-5 h-5 hidden"></i>
                        </button>
                    </div>
                </div>
                <!-- Resize Handle -->
                <div id="resizeHandle" class="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize z-50 flex items-end justify-end p-1 opacity-50 hover:opacity-100 transition-opacity">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2L2 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="text-slate-400 dark:text-slate-500"/>
                        <path d="M8 6L6 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="text-slate-400 dark:text-slate-500"/>
                    </svg>
                </div>
            </section>

            <!-- Chat FAB (Floating Action Button) -->
            <button id="chatFab" onclick="toggleChat()" class="fixed bottom-10 right-10 z-40 w-14 h-14 bg-violet-600 hover:bg-violet-700 text-white rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 opacity-0 transform scale-0">
                 <i data-lucide="message-square" class="w-7 h-7"></i>
            </button>

        </div>
    </main>

    <!-- JS Logic -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
